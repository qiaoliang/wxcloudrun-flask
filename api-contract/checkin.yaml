openapi: 3.0.3
info:
  title: SafeGuard API - Checkin Domain
  description: Checkin domain API endpoints
  version: 1.0.0
  contact:
    name: SafeGuard Development Team
    email: dev@safeguard.com
servers:
- url: http://localhost:9999/api
  description: 开发环境
- url: https://prod.safeguard.com/api
  description: 生产环境
paths:
  /api/checkin/today:
    get:
      tags:
      - 打卡模块
      summary: 获取用户今日打卡事项列表
      description: 获取用户今天的打卡事项列表
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user_id:
                          type: integer
                          description: 用户ID
                        date:
                          type: string
                          format: date
                          description: 日期（YYYY-MM-DD）
                        checkin_items:
                          type: array
                          description: 打卡事项列表
                          items:
                            type: object
                            properties:
                              rule_id:
                                type: integer
                                description: 规则ID
                              rule_name:
                                type: string
                                description: 规则名称
                              icon_url:
                                type: string
                                description: 图标URL
                                nullable: true
                              frequency_type:
                                type: integer
                                description: 频率类型（0-每天，1-每周，2-工作日，3-自定义日期范围）
                              time_slot_type:
                                type: integer
                                description: 时间段类型（0-全天，1-指定时间）
                              custom_time:
                                type: string
                                description: 自定义时间（HH:MM格式）
                                nullable: true
                              status:
                                type: string
                                description: 打卡状态（pending-待打卡，checked-已打卡，unchecked-已错过）
                                enum: [pending, checked, unchecked]
                              checkin_time:
                                type: string
                                description: 实际打卡时间
                                format: date-time
                                nullable: true
                              record_id:
                                type: integer
                                description: 打卡记录ID
                                nullable: true
                        total:
                          type: integer
                          description: 总打卡事项数
                        checked:
                          type: integer
                          description: 已打卡数量
                        unchecked:
                          type: integer
                          description: 已错过数量
  /api/checkin:
    post:
      tags:
      - 打卡模块
      summary: 执行打卡
      description: 用户执行打卡操作
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule_id
              properties:
                rule_id:
                  type: integer
                  description: 规则ID
      responses:
        '200':
          description: 打卡成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        record_id:
                          type: integer
                        checkin_time:
                          type: string
                        status:
                          type: string
  /api/checkin/miss:
    post:
      tags:
      - 打卡模块
      summary: 上报漏打卡
      description: 上报漏打卡情况
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule_id
              properties:
                rule_id:
                  type: integer
                  description: 规则ID
                reason:
                  type: string
                  description: 漏打卡原因
      responses:
        '200':
          description: 上报成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /api/checkin/cancel:
    post:
      tags:
      - 打卡模块
      summary: 取消打卡
      description: 取消已执行的打卡操作
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - record_id
              properties:
                record_id:
                  type: integer
                  description: 打卡记录ID
                reason:
                  type: string
                  description: 取消原因
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /api/checkin/history:
    get:
      tags:
      - 打卡模块
      summary: 获取打卡历史记录
      description: 获取用户的打卡历史记录
      security:
      - BearerAuth: []
      parameters:
      - name: start_date
        in: query
        schema:
          type: string
          format: date
        description: 开始日期
      - name: end_date
        in: query
        schema:
          type: string
          format: date
        description: 结束日期
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: 页码
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
        description: 每页数量
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        history:
                          type: array
                          items:
                            type: object
                            properties:
                              record_id:
                                type: integer
                                description: 记录ID
                              user_id:
                                type: integer
                                description: 用户ID
                              rule_id:
                                type: integer
                                description: 规则ID
                              checkin_time:
                                type: string
                                format: date-time
                                description: 打卡时间
                              status:
                                type: integer
                                description: 打卡状态（0-未打卡，1-已打卡，2-已错过，3-已取消）
                              status_name:
                                type: string
                                description: 状态名称
                              planned_time:
                                type: string
                                format: date-time
                                description: 计划打卡时间
                        total:
                          type: integer
                          description: 总记录数
                        page:
                          type: integer
                          description: 当前页码
                        page_size:
                          type: integer
                          description: 每页数量
                        total_pages:
                          type: integer
                          description: 总页数
  /api/checkin/rules:
    get:
      tags:
      - 打卡模块
      summary: 获取打卡规则列表
      description: 获取用户的个人打卡规则列表
      security:
      - BearerAuth: []
      parameters:
      - name: rule_id
        in: query
        schema:
          type: integer
        description: 规则ID（可选，获取单个规则）
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        rules:
                          type: array
                          items:
                            type: object
                            properties:
                              rule_id:
                                type: integer
                                description: 规则ID
                              user_id:
                                type: integer
                                description: 用户ID
                              rule_name:
                                type: string
                                description: 规则名称
                              frequency_type:
                                type: integer
                                description: 频率类型（0-每天，1-每周，2-工作日，3-自定义日期范围）
                              time_slot_type:
                                type: integer
                                description: 时间段类型（0-全天，1-指定时间，2-上午，3-下午，4-晚上）
                              status:
                                type: integer
                                description: 规则状态（0-禁用，1-启用）
                              community_id:
                                type: integer
                                description: 社区ID
                                nullable: true
                              icon_url:
                                type: string
                                description: 图标URL
                                nullable: true
                              custom_time:
                                type: string
                                description: 自定义时间（HH:MM:SS格式）
                                nullable: true
                              week_days:
                                type: integer
                                description: 星期位掩码
                                nullable: true
                              custom_start_date:
                                type: string
                                format: date-time
                                description: 自定义开始日期
                                nullable: true
                              custom_end_date:
                                type: string
                                format: date-time
                                description: 自定义结束日期
                                nullable: true
                              created_at:
                                type: string
                                format: date-time
                                description: 创建时间
                                nullable: true
                              updated_at:
                                type: string
                                format: date-time
                                description: 更新时间
                                nullable: true
    post:
      tags:
      - 打卡模块
      summary: 创建打卡规则
      description: 创建新的个人打卡规则
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule_name
              - frequency_type
              - time_slot_type
              properties:
                rule_name:
                  type: string
                  description: 规则名称
                description:
                  type: string
                  description: 规则描述
                frequency_type:
                  type: integer
                  description: 频率类型（0-每天，1-每周，2-工作日，3-自定义日期范围）
                  enum: [0, 1, 2, 3]
                time_slot_type:
                  type: integer
                  description: 时间段类型（0-全天，1-指定时间，2-上午，3-下午，4-晚上）
                  enum: [0, 1, 2, 3, 4]
                custom_time:
                  type: string
                  description: 自定义时间（HH:MM格式，当time_slot_type=1时必填）
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                week_days:
                  type: array
                  description: 星期几（当frequency_type=1时必填，0=周一，6=周日）
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                custom_start_date:
                  type: string
                  description: 自定义开始日期（当frequency_type=3时必填，YYYY-MM-DD格式）
                  format: date
                custom_end_date:
                  type: string
                  description: 自定义结束日期（当frequency_type=3时必填，YYYY-MM-DD格式）
                  format: date
                icon_url:
                  type: string
                  description: 图标URL
                  nullable: true
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        rule:
                          type: object
                          properties:
                            rule_id:
                              type: integer
                              description: 规则ID
                            user_id:
                              type: integer
                              description: 用户ID
                            rule_name:
                              type: string
                              description: 规则名称
                            frequency_type:
                              type: integer
                              description: 频率类型（0-每天，1-每周，2-工作日，3-自定义日期范围）
                            time_slot_type:
                              type: integer
                              description: 时间段类型（0-全天，1-指定时间，2-上午，3-下午，4-晚上）
                            status:
                              type: integer
                              description: 规则状态（0-禁用，1-启用）
                            community_id:
                              type: integer
                              description: 社区ID
                              nullable: true
                            icon_url:
                              type: string
                              description: 图标URL
                              nullable: true
                            custom_time:
                              type: string
                              description: 自定义时间（HH:MM:SS格式）
                              nullable: true
                            week_days:
                              type: integer
                              description: 星期位掩码（1=周一，2=周二，...，64=周日）
                              nullable: true
                            custom_start_date:
                              type: string
                              format: date-time
                              description: 自定义开始日期
                              nullable: true
                            custom_end_date:
                              type: string
                              format: date-time
                              description: 自定义结束日期
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                              description: 创建时间
                              nullable: true
                            updated_at:
                              type: string
                              format: date-time
                              description: 更新时间
                              nullable: true
    put:
      tags:
      - 打卡模块
      summary: 更新打卡规则
      description: 更新现有的个人打卡规则
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rule_id
              properties:
                rule_id:
                  type: integer
                  description: 规则ID
                rule_name:
                  type: string
                  description: 规则名称
                description:
                  type: string
                  description: 规则描述
                frequency_type:
                  type: integer
                  description: 频率类型（0-每天，1-每周，2-工作日，3-自定义日期范围）
                  enum: [0, 1, 2, 3]
                time_slot_type:
                  type: integer
                  description: 时间段类型（0-全天，1-指定时间，2-上午，3-下午，4-晚上）
                  enum: [0, 1, 2, 3, 4]
                custom_time:
                  type: string
                  description: 自定义时间（HH:MM格式）
                  pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
                week_days:
                  type: array
                  description: 星期几（0=周一，6=周日）
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                custom_start_date:
                  type: string
                  description: 自定义开始日期（YYYY-MM-DD格式）
                  format: date
                custom_end_date:
                  type: string
                  description: 自定义结束日期（YYYY-MM-DD格式）
                  format: date
                icon_url:
                  type: string
                  description: 图标URL
                  nullable: true
                status:
                  type: integer
                  description: 规则状态（0-禁用，1-启用）
                  enum: [0, 1]
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        rule:
                          type: object
                          properties:
                            rule_id:
                              type: integer
                              description: 规则ID
                            user_id:
                              type: integer
                              description: 用户ID
                            rule_name:
                              type: string
                              description: 规则名称
                            frequency_type:
                              type: integer
                              description: 频率类型
                            time_slot_type:
                              type: integer
                              description: 时间段类型
                            status:
                              type: integer
                              description: 规则状态
                            community_id:
                              type: integer
                              description: 社区ID
                              nullable: true
                            icon_url:
                              type: string
                              description: 图标URL
                              nullable: true
                            custom_time:
                              type: string
                              description: 自定义时间
                              nullable: true
                            week_days:
                              type: integer
                              description: 星期位掩码
                              nullable: true
                            custom_start_date:
                              type: string
                              format: date-time
                              description: 自定义开始日期
                              nullable: true
                            custom_end_date:
                              type: string
                              format: date-time
                              description: 自定义结束日期
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                              description: 创建时间
                              nullable: true
                            updated_at:
                              type: string
                              format: date-time
                              description: 更新时间
                              nullable: true
    delete:
      tags:
      - 打卡模块
      summary: 删除打卡规则
      description: 删除个人打卡规则
      security:
      - BearerAuth: []
      parameters:
      - name: rule_id
        in: query
        required: true
        schema:
          type: integer
        description: 规则ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        code:
          type: integer
          description: 1-成功，0-失败
          example: 1
        msg:
          type: string
          description: 状态消息
          example: success
        data:
          type: object
          description: 响应数据
          nullable: true
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        msg:
          type: string
          example: error message
        data:
          type: object
          nullable: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
