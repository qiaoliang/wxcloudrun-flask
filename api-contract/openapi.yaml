                                supervised_user_id:
                                    type: integer
                                    description: 被监护人用户ID
                                rule_id:
                                    type: integer
                                    description: 打卡规则ID
                                template_type:
                                    type: string
                                    enum: [default, remember, wake_up, sleep, custom]
