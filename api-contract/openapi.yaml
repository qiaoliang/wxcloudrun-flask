                                                      items:
                                                          type: object
                                                          properties:
                                                              rule_id:
                                                                  type: integer
                                                                  description: 规则ID
                                                              rule_name:
                                                                  type: string
                                                                  description: 规则名称
                                                              rule_icon:
                                                                  type: string
                                                                  description: 规则图标
                                                              total_missed:
                                                                  type: integer
                                                                  description: 未打卡人次总和
                                                              daily_missed:
                                                                  type: array
                                                                  description: 每日未打卡人数
                                                                  items:
                                                                      type: integer
                                                              dates:
                                                                  type: array
                                                                  description: 日期列表
                                                                  items:
                                                                      type: string
                                                                      format: date
                                                  total_rules:
                                                      type: integer
                                                      description: 启用的规则总数

