    /community_checkin/stats/{community_id}/daily-stats:
        get:
            tags:
                - 社区打卡模块
            summary: 获取社区每日打卡统计
            description: 获取指定社区的每日打卡统计数据，包括用户总数、打卡率、未打卡人数等
            parameters:
                - name: community_id
                  in: path
                  required: true
                  schema:
                      type: integer
                  description: 社区ID
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  user_count:
                                                      type: integer
                                                      description: 社区用户总数
                                                  total_rules:
                                                      type: integer
                                                      description: 启用的规则总数
                                                  total_checkins:
                                                      type: integer
                                                      description: 今日打卡总数
                                                  completed_checkins:
                                                      type: integer
                                                      description: 今日已完成打卡数
                                                  missed_checkins:
                                                      type: integer
                                                      description: 今日未打卡数
                                                  checkin_rate:
                                                      type: number
                                                      format: float
                                                      description: 今日打卡率（百分比）
                                                  unchecked_user_count:
                                                      type: integer
                                                      description: 今日未打卡用户数（去重）

    /community_checkin/stats/{community_id}/checkin-stats:
        get:
            tags:
                - 社区打卡模块
            summary: 获取社区打卡统计信息
            description: 获取指定社区打卡规则的统计信息，包括近7天未打卡人次最多的规则
            parameters:
                - name: community_id
                  in: path
                  required: true
                  schema:
                      type: integer
                  description: 社区ID
                - name: days
                  in: query
                  schema:
                      type: integer
                      default: 7
                      minimum: 1
                      maximum: 30
                  description: 统计天数（默认7天）
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  stats:
                                                      type: array
