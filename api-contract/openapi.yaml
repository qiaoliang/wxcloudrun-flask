openapi: 3.0.3
info:
    title: SafeGuard API
    description: SafeGuard 微信小程序后端API服务
    version: 1.0.0
    contact:
        name: SafeGuard Development Team
        email: dev@safeguard.com

servers:
    - url: http://localhost:9999/api
      description: 开发环境
    - url: https://prod.safeguard.com/api
      description: 生产环境

# 通用组件定义
components:
    schemas:
        # 标准响应格式
        StandardResponse:
            type: object
            properties:
                code:
                    type: integer
                    description: 1-成功，0-失败
                    example: 1
                msg:
                    type: string
                    description: 状态消息
                    example: "success"
                data:
                    type: object
                    description: 响应数据
                    nullable: true

        # 错误响应
        ErrorResponse:
            type: object
            properties:
                code:
                    type: integer
                    example: 0
                msg:
                    type: string
                    example: "error message"
                data:
                    type: object
                    nullable: true

        # 用户信息
        UserInfo:
            type: object
            properties:
                user_id:
                    type: integer
                    description: 用户ID
                nickname:
                    type: string
                    description: 昵称
                avatar_url:
                    type: string
                    description: 头像URL
                phone_number:
                    type: string
                    description: 手机号
                wechat_openid:
                    type: string
                    description: 微信openid
                community_id:
                    type: integer
                    description: 社区ID
                role:
                    type: integer
                    description: 用户角色
                status:
                    type: integer
                    description: 用户状态

        # 分页信息
        PaginationInfo:
            type: object
            properties:
                page:
                    type: integer
                    description: 当前页码
                per_page:
                    type: integer
                    description: 每页数量
                total:
                    type: integer
                    description: 总记录数
                has_next:
                    type: boolean
                    description: 是否有下一页

    # 认证方案
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

# 全局安全要求
security:
    - BearerAuth: []

# API路径定义
paths:
    # ==========================================
    # 认证模块 (auth)
    # ==========================================
    /auth/login_wechat:
        post:
            tags:
                - 认证模块
            summary: 微信登录
            description: 通过微信code进行用户登录
            security: [] # 无需认证
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - code
                            properties:
                                code:
                                    type: string
                                    description: 微信登录code
                                nickname:
                                    type: string
                                    description: 用户昵称（可选）
                                avatar_url:
                                    type: string
                                    description: 用户头像URL（可选）
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                      description: JWT访问令牌
                                                  refresh_token:
                                                      type: string
                                                      description: 刷新令牌
                                                  user_id:
                                                      type: integer
                                                      description: 用户ID
                                                  wechat_openid:
                                                      type: string
                                                      description: 微信openid
                                                  phone_number:
                                                      type: string
                                                      description: 手机号
                                                  login_type:
                                                      type: string
                                                      description: 登录类型

    /auth/register_phone:
        post:
            tags:
                - 认证模块
            summary: 手机号注册
            description: 使用手机号和验证码注册新用户
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                                - code
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                code:
                                    type: string
                                    description: 验证码
                                nickname:
                                    type: string
                                    description: 昵称（可选）
                                avatar_url:
                                    type: string
                                    description: 头像URL（可选）
                                password:
                                    type: string
                                    description: 密码（可选）
            responses:
                "200":
                    description: 注册成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  refresh_token:
                                                      type: string
                                                  user_id:
                                                      type: integer

    /auth/refresh_token:
        post:
            tags:
                - 认证模块
            summary: 刷新访问令牌
            description: 使用刷新令牌获取新的访问令牌
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - refresh_token
                            properties:
                                refresh_token:
                                    type: string
                                    description: 刷新令牌
            responses:
                "200":
                    description: 刷新成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  refresh_token:
                                                      type: string
                                                  expires_in:
                                                      type: integer
                                                      description: 令牌过期时间（秒）

    # ==========================================
    # 用户模块 (user)
    # ==========================================
    /user/profile:
        get:
            tags:
                - 用户模块
            summary: 获取用户信息
            description: 获取当前登录用户的详细信息
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/UserInfo"

        post:
            tags:
                - 用户模块
            summary: 更新用户信息
            description: 更新当前登录用户的信息
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                nickname:
                                    type: string
                                    description: 昵称
                                name:
                                    type: string
                                    description: 真实姓名
                                avatar_url:
                                    type: string
                                    description: 头像URL
            responses:
                "200":
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /user/search:
        get:
            tags:
                - 用户模块
            summary: 搜索用户
            description: 根据关键词搜索用户
            parameters:
                - name: keyword
                  in: query
                  required: true
                  schema:
                      type: string
                  description: 搜索关键词
                - name: type
                  in: query
                  schema:
                      type: string
                      enum: [all, phone, nickname]
                      default: all
                  description: 搜索类型
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: 页码
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: 每页数量
            responses:
                "200":
                    description: 搜索成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  users:
                                                      type: array
                                                      items:
                                                          $ref: "#/components/schemas/UserInfo"
                                                  total:
                                                      type: integer
                                                  page:
                                                      type: integer
                                                  per_page:
                                                      type: integer
                                                  has_next:
                                                      type: boolean

    /user/bind_phone:
        post:
            tags:
                - 用户模块
            summary: 绑定手机号
            description: 为当前用户绑定手机号
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                                - code
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                code:
                                    type: string
                                    description: 验证码
            responses:
                "200":
                    description: 绑定成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    # ==========================================
    # 监督模块 (supervision) - 统一使用 /api/supervision/
    # ==========================================
    /supervision/invite:
        post:
            tags:
                - 监督模块
            summary: 邀请监督者
            description: 邀请特定用户监督特定规则
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - rule_ids
                                - target_openid
                            properties:
                                invite_type:
                                    type: string
                                    enum: [wechat, phone]
                                    default: wechat
                                    description: 邀请类型
                                rule_ids:
                                    type: array
                                    items:
                                        type: integer
                                    description: 要监督的规则ID列表
                                target_openid:
                                    type: string
                                    description: 被邀请用户的openid
            responses:
                "200":
                    description: 邀请发送成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  message:
                                                      type: string
                                                  relations_count:
                                                      type: integer

    /supervision/invite_link:
        post:
            tags:
                - 监督模块
            summary: 创建监督邀请链接
            description: 生成监督邀请链接（无需目标openid）
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - rule_ids
                            properties:
                                rule_ids:
                                    type: array
                                    items:
                                        type: integer
                                    description: 要监督的规则ID列表
                                expire_hours:
                                    type: integer
                                    default: 24
                                    description: 链接过期时间（小时）
            responses:
                "200":
                    description: 创建成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  url:
                                                      type: string
                                                  mini_path:
                                                      type: string
                                                  expire_at:
                                                      type: string
                                                      format: date-time

    /supervision/invite/resolve:
        get:
            tags:
                - 监督模块
            summary: 解析监督邀请链接
            description: 解析邀请链接，返回监督邀请信息
            parameters:
                - name: token
                  in: query
                  required: true
                  schema:
                      type: string
                  description: 邀请token
            responses:
                "200":
                    description: 解析成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  supervisor_id:
                                                      type: integer
                                                  supervisor_nickname:
                                                      type: string
                                                  rule_ids:
                                                      type: array
                                                      items:
                                                          type: integer
                                                  expires_at:
                                                      type: string
                                                      format: date-time

    /supervision/invitations:
        get:
            tags:
                - 监督模块
            summary: 获取监督邀请列表
            description: 获取当前用户的监督邀请列表
            parameters:
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [pending, accepted, rejected]
                  description: 邀请状态筛选
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: 页码
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: 每页数量
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  invitations:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              invitation_id:
                                                                  type: integer
                                                              supervisor_id:
                                                                  type: integer
                                                              supervisor_nickname:
                                                                  type: string
                                                              supervised_id:
                                                                  type: integer
                                                              supervised_nickname:
                                                                  type: string
                                                              rule_ids:
                                                                  type: array
                                                                  items:
                                                                      type: integer
                                                              status:
                                                                  type: string
                                                              invited_at:
                                                                  type: string
                                                                  format: date-time
                                                  total:
                                                      type: integer

    /supervision/accept:
        post:
            tags:
                - 监督模块
            summary: 接受监督邀请
            description: 接受监督邀请，建立监督关系
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - invitation_id
                            properties:
                                invitation_id:
                                    type: integer
                                    description: 邀请ID
            responses:
                "200":
                    description: 接受成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /supervision/reject:
        post:
            tags:
                - 监督模块
            summary: 拒绝监督邀请
            description: 拒绝监督邀请
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - invitation_id
                            properties:
                                invitation_id:
                                    type: integer
                                    description: 邀请ID
                                reason:
                                    type: string
                                    description: 拒绝原因
            responses:
                "200":
                    description: 拒绝成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /supervision/my_supervised:
        get:
            tags:
                - 监督模块
            summary: 获取我监督的用户列表
            description: 获取当前用户监督的所有用户列表
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: 页码
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: 每页数量
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  supervised_users:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              user_id:
                                                                  type: integer
                                                              nickname:
                                                                  type: string
                                                              avatar_url:
                                                                  type: string
                                                              supervision_count:
                                                                  type: integer
                                                              last_checkin:
                                                                  type: string
                                                                  format: date-time
                                                              status:
                                                                  type: string
                                                  total:
                                                      type: integer

    /supervision/my_guardians:
        get:
            tags:
                - 监督模块
            summary: 获取我的监护人列表
            description: 获取监督当前用户的所有监护人列表
            parameters:
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: 页码
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: 每页数量
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  guardians:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              user_id:
                                                                  type: integer
                                                              nickname:
                                                                  type: string
                                                              avatar_url:
                                                                  type: string
                                                              supervision_count:
                                                                  type: integer
                                                              last_checkin:
                                                                  type: string
                                                                  format: date-time
                                                              status:
                                                                  type: string
                                                  total:
                                                      type: integer

    /supervision/records:
        get:
            tags:
                - 监督模块
            summary: 获取监督记录
            description: 获取被监督用户的打卡记录
            parameters:
                - name: supervised_user_id
                  in: query
                  required: true
                  schema:
                      type: integer
                  description: 被监督用户ID
                - name: rule_id
                  in: query
                  schema:
                      type: integer
                  description: 规则ID（可选）
                - name: start_date
                  in: query
                  schema:
                      type: string
                      format: date
                  description: 开始日期（YYYY-MM-DD）
                - name: end_date
                  in: query
                  schema:
                      type: string
                      format: date
                  description: 结束日期（YYYY-MM-DD）
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: 页码
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: 每页数量
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  records:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              record_id:
                                                                  type: integer
                                                              supervisor_id:
                                                                  type: integer
                                                              supervisor_nickname:
                                                                  type: string
                                                              supervised_id:
                                                                  type: integer
                                                              supervised_nickname:
                                                                  type: string
                                                              rule_id:
                                                                  type: integer
                                                              rule_name:
                                                                  type: string
                                                              checkin_time:
                                                                  type: string
                                                                  format: date-time
                                                              status:
                                                                  type: string
                                                              created_at:
                                                                  type: string
                                                                  format: date-time
                                                  total:
                                                      type: integer

    # ==========================================
    # 短信模块 (sms)
    # ==========================================
    /sms/send_code:
        post:
            tags:
                - 短信模块
            summary: 发送验证码
            description: 向指定手机号发送验证码
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                purpose:
                                    type: string
                                    enum: [register, login, bind_phone]
                                    default: register
                                    description: 验证码用途
            responses:
                "200":
                    description: 发送成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  message:
                                                      type: string
                                                  code:
                                                      type: string
                                                      description: 验证码（仅测试环境返回）

    # ==========================================
    # 社区模块 (community)
    # ==========================================
    /community/list:
        get:
            tags:
                - 社区模块
            summary: 获取社区列表
            description: 获取用户可见的社区列表
            parameters:
                - name: status
                  in: query
                  schema:
                      type: string
                      enum: [all, active, inactive]
                      default: all
                  description: 状态筛选
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: 页码
                - name: page_size
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: 每页数量
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  communities:
                                                      type: array
                                                      items:
                                                          type: object
                                                          properties:
                                                              community_id:
                                                                  type: integer
                                                              name:
                                                                  type: string
                                                              description:
                                                                  type: string
                                                              creator_id:
                                                                  type: integer
                                                              status:
                                                                  type: integer
                                                              created_at:
                                                                  type: string
                                                                  format: date-time

    /communities/{community_id}:
        get:
            tags:
                - 社区模块
            summary: 获取社区详情
            description: 获取指定社区的详细信息
            parameters:
                - name: community_id
                  in: path
                  required: true
                  schema:
                      type: integer
                  description: 社区ID
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  community_id:
                                                      type: integer
                                                  name:
                                                      type: string
                                                  description:
                                                      type: string
                                                  creator:
                                                      type: object
                                                      properties:
                                                          user_id:
                                                              type: integer
                                                          nickname:
                                                              type: string
                                                          avatar_url:
                                                              type: string
                                                  status:
                                                      type: integer
                                                  manager_count:
                                                      type: integer
                                                      description: 主管数量
                                                  worker_count:
                                                      type: integer
                                                      description: 工作人员总数（主管+专员）
                                                  stats:
                                                      type: object
                                                      properties:
                                                          staff_count:
