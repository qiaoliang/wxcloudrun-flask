openapi: 3.0.3
info:
    title: SafeGuard API
    description: SafeGuard 微信小程序后端API服务
    version: 1.0.0
    contact:
        name: SafeGuard Development Team
        email: dev@safeguard.com

servers:
    - url: http://localhost:9999/api
      description: 开发环境
    - url: https://prod.safeguard.com/api
      description: 生产环境

# 通用组件定义
components:
    schemas:
        # 标准响应格式
        StandardResponse:
            type: object
            properties:
                code:
                    type: integer
                    description: 1-成功，0-失败
                    example: 1
                msg:
                    type: string
                    description: 状态消息
                    example: "success"
                data:
                    type: object
                    description: 响应数据
                    nullable: true

        # 错误响应
        ErrorResponse:
            type: object
            properties:
                code:
                    type: integer
                    example: 0
                msg:
                    type: string
                    example: "error message"
                data:
                    type: object
                    nullable: true

        # 用户信息
        UserInfo:
            type: object
            properties:
                user_id:
                    type: integer
                    description: 用户ID
                nickname:
                    type: string
                    description: 昵称
                avatar_url:
                    type: string
                    description: 头像URL
                phone_number:
                    type: string
                    description: 手机号
                wechat_openid:
                    type: string
                    description: 微信openid
                community_id:
                    type: integer
                    description: 社区ID
                role:
                    type: integer
                    description: 用户角色
                status:
                    type: integer
                    description: 用户状态

        # 分页信息
        PaginationInfo:
            type: object
            properties:
                page:
                    type: integer
                    description: 当前页码
                per_page:
                    type: integer
                    description: 每页数量
                total:
                    type: integer
                    description: 总记录数
                has_next:
                    type: boolean
                    description: 是否有下一页

        # 病史记录
        MedicalHistory:
            type: object
            properties:
                id:
                    type: integer
                    description: 病史记录ID
                user_id:
                    type: integer
                    description: 用户ID
                condition_name:
                    type: string
                    description: 疾病名称
                treatment_plan:
                    type: object
                    description: 治疗方案（JSON格式）
                    properties:
                        type:
                            type: string
                            enum: [medication, injection, other]
                            description: 治疗类型
                        medications:
                            type: array
                            items:
                                type: string
                            description: 药物列表（吃药时使用）
                        medication:
                            type: string
                            description: 药物名称（打针时使用）
                        frequency:
                            type: string
                            description: 频率
                        note:
                            type: string
                            description: 备注
                visibility:
                    type: integer
                    description: 可见性（1=仅工作人员，2=工作人员和监护人）
                    enum: [1, 2]
                created_at:
                    type: string
                    format: date-time
                    description: 创建时间
                updated_at:
                    type: string
                    format: date-time
                    description: 更新时间

        # 浏览记录
        ProfileViewLog:
            type: object
            properties:
                id:
                    type: integer
                    description: 记录ID
                viewer_id:
                    type: integer
                    description: 查看者用户ID
                viewed_user_id:
                    type: integer
                    description: 被查看用户ID
                ward_user_id:
                    type: integer
                    description: 被监护人用户ID（查看监护人信息时）
                    nullable: true
                community_id:
                    type: integer
                    description: 社区ID
                view_type:
                    type: string
                    enum: [profile, guardian]
                    description: 浏览类型（profile=成员信息，guardian=监护人信息）
                created_at:
                    type: string
                    format: date-time
                    description: 浏览时间

        # 社区信息
        CommunityInfo:
            type: object
            properties:
                community_id:
                    type: integer
                    description: 社区ID
                name:
                    type: string
                    description: 社区名称
                description:
                    type: string
                    description: 社区描述
                creator_id:
                    type: integer
                    description: 创建者ID
                status:
                    type: integer
                    description: 社区状态
                created_at:
                    type: string
                    format: date-time
                    description: 创建时间

        # 事件信息
        EventInfo:
            type: object
            properties:
                event_id:
                    type: integer
                    description: 事件ID
                community_id:
                    type: integer
                    description: 社区ID
                user_id:
                    type: integer
                    description: 用户ID
                event_type:
                    type: string
                    description: 事件类型
                title:
                    type: string
                    description: 事件标题
                description:
                    type: string
                    description: 事件描述
                status:
                    type: string
                    description: 事件状态
                created_at:
                    type: string
                    format: date-time
                    description: 创建时间

    # 认证方案
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

# 全局安全要求
security:
    - BearerAuth: []

# API路径定义
paths:
    # ==========================================
    # 根路径
    # ==========================================
    /:
        get:
            tags:
                - 杂项模块
            summary: 返回index页面
            description: 返回首页HTML页面
            security: []
            responses:
                "200":
                    description: 成功
                    content:
                        text/html:
                            schema:
                                type: string

    /api/env:
        get:
            tags:
                - 杂项模块
            summary: 返回环境配置查看器页面
            description: 返回环境配置查看器HTML页面
            security: []
            responses:
                "200":
                    description: 成功
                    content:
                        text/html:
                            schema:
                                type: string

    /api/get_envs:
        get:
            tags:
                - 杂项模块
            summary: 获取环境配置信息
            description: 获取系统环境配置和外部系统状态
            security: []
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  config_status:
                                                      type: object
                                                  external_status:
                                                      type: object
                                                  timestamp:
                                                      type: string
                                                      format: date-time

    /api/count:
        get:
            tags:
                - 杂项模块
            summary: 获取计数器
            description: 获取计数器信息
            security: []
            parameters:
                - name: id
                  in: query
                  schema:
                      type: integer
                  description: 计数器ID（可选，不提供则返回所有）
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  id:
                                                      type: integer
                                                  count:
                                                      type: integer

        post:
            tags:
                - 杂项模块
            summary: 计数器操作
            description: 对计数器进行操作（增加、重置、获取、清除等）
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - action
                            properties:
                                action:
                                    type: string
                                    enum: [increment, reset, get, list, clear]
                                    description: 操作类型
                                counter_id:
                                    type: integer
                                    description: 计数器ID
                                id:
                                    type: integer
                                    description: 计数器ID（用于get操作）
            responses:
                "200":
                    description: 操作成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /api/upload/media:
        post:
            tags:
                - 杂项模块
            summary: 上传媒体文件
            description: 上传图片、视频等媒体文件
            security: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - file
                            properties:
                                file:
                                    type: string
                                    format: binary
                                    description: 媒体文件
            responses:
                "200":
                    description: 上传成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  url:
                                                      type: string
                                                      description: 文件URL

    # ==========================================
    # 认证模块 (auth)
    # ==========================================
    /api/auth/login_wechat:
        post:
            tags:
                - 认证模块
            summary: 微信登录
            description: 通过微信code进行用户登录
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - code
                            properties:
                                code:
                                    type: string
                                    description: 微信登录code
                                nickname:
                                    type: string
                                    description: 用户昵称（可选）
                                avatar_url:
                                    type: string
                                    description: 用户头像URL（可选）
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                      description: JWT访问令牌
                                                  refresh_token:
                                                      type: string
                                                      description: 刷新令牌
                                                  user_id:
                                                      type: integer
                                                      description: 用户ID
                                                  wechat_openid:
                                                      type: string
                                                      description: 微信openid
                                                  phone_number:
                                                      type: string
                                                      description: 手机号
                                                  login_type:
                                                      type: string
                                                      description: 登录类型

    /api/auth/register_phone:
        post:
            tags:
                - 认证模块
            summary: 手机号注册
            description: 使用手机号和验证码注册新用户
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                                - code
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                code:
                                    type: string
                                    description: 验证码
                                nickname:
                                    type: string
                                    description: 昵称（可选）
                                avatar_url:
                                    type: string
                                    description: 头像URL（可选）
                                password:
                                    type: string
                                    description: 密码（可选）
            responses:
                "200":
                    description: 注册成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  refresh_token:
                                                      type: string
                                                  user_id:
                                                      type: integer

    /api/auth/refresh_token:
        post:
            tags:
                - 认证模块
            summary: 刷新访问令牌
            description: 使用刷新令牌获取新的访问令牌
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - refresh_token
                            properties:
                                refresh_token:
                                    type: string
                                    description: 刷新令牌
            responses:
                "200":
                    description: 刷新成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  refresh_token:
                                                      type: string
                                                  expires_in:
                                                      type: integer
                                                      description: 令牌过期时间（秒）

    /api/auth/login_phone_code:
        post:
            tags:
                - 认证模块
            summary: 手机号验证码登录
            description: 使用手机号和验证码登录
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                                - code
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                code:
                                    type: string
                                    description: 验证码
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  refresh_token:
                                                      type: string
                                                  user_id:
                                                      type: integer

    /api/auth/login_phone_password:
        post:
            tags:
                - 认证模块
            summary: 手机号密码登录
            description: 使用手机号和密码登录
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                                - password
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                password:
                                    type: string
                                    description: 密码
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  refresh_token:
                                                      type: string
                                                  user_id:
                                                      type: integer

    /api/auth/login_phone:
        post:
            tags:
                - 认证模块
            summary: 手机号登录（验证码+密码）
            description: 使用手机号登录，支持验证码或密码两种方式
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                code:
                                    type: string
                                    description: 验证码（与password二选一）
                                password:
                                    type: string
                                    description: 密码（与code二选一）
            responses:
                "200":
                    description: 登录成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  token:
                                                      type: string
                                                  refresh_token:
                                                      type: string
                                                  user_id:
                                                      type: integer

    /api/logout:
        post:
            tags:
                - 认证模块
            summary: 用户登出
            description: 用户退出登录
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: 登出成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    # ==========================================
    # 用户模块 (user)
    # ==========================================
    /api/user/profile:
        get:
            tags:
                - 用户模块
            summary: 获取用户信息
            description: 获取当前登录用户的详细信息
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/UserInfo"

        post:
            tags:
                - 用户模块
            summary: 更新用户信息
            description: 更新当前登录用户的信息
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                nickname:
                                    type: string
                                    description: 昵称
                                name:
                                    type: string
                                    description: 真实姓名
                                avatar_url:
                                    type: string
                                    description: 头像URL
            responses:
                "200":
                    description: 更新成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /api/user/upload-avatar:
        post:
            tags:
                - 用户模块
            summary: 上传用户头像
            description: 上传用户头像图片
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - avatar
                            properties:
                                avatar:
                                    type: string
                                    format: binary
                                    description: 头像图片文件
            responses:
                "200":
                    description: 上传成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  avatar_url:
                                                      type: string
                                                      description: 头像URL

    /api/user/change-password:
        post:
            tags:
                - 用户模块
            summary: 修改用户密码
            description: 修改当前用户的登录密码
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - old_password
                                - new_password
                            properties:
                                old_password:
                                    type: string
                                    description: 旧密码
                                new_password:
                                    type: string
                                    description: 新密码
            responses:
                "200":
                    description: 修改成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /api/user/search:
        get:
            tags:
                - 用户模块
            summary: 搜索用户
            description: 根据关键词搜索用户
            security:
                - BearerAuth: []
            parameters:
                - name: keyword
                  in: query
                  required: true
                  schema:
                      type: string
                  description: 搜索关键词
                - name: type
                  in: query
                  schema:
                      type: string
                      enum: [all, phone, nickname]
                      default: all
                  description: 搜索类型
                - name: page
                  in: query
                  schema:
                      type: integer
                      default: 1
                  description: 页码
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      default: 20
                  description: 每页数量
            responses:
                "200":
                    description: 搜索成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  users:
                                                      type: array
                                                      items:
                                                          $ref: "#/components/schemas/UserInfo"
                                                  total:
                                                      type: integer
                                                  page:
                                                      type: integer
                                                  per_page:
                                                      type: integer
                                                  has_next:
                                                      type: boolean

    /api/user/bind_phone:
        post:
            tags:
                - 用户模块
            summary: 绑定手机号
            description: 为当前用户绑定手机号
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - phone
                                - code
                            properties:
                                phone:
                                    type: string
                                    description: 手机号
                                code:
                                    type: string
                                    description: 验证码
            responses:
                "200":
                    description: 绑定成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /api/user/bind_wechat:
        post:
            tags:
                - 用户模块
            summary: 绑定微信账号
            description: 为当前用户绑定微信账号
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - code
                            properties:
                                code:
                                    type: string
                                    description: 微信登录code
            responses:
                "200":
                    description: 绑定成功
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/StandardResponse"

    /api/user/community/verify:
        post:
            tags:
                - 用户模块
            summary: 验证用户社区成员身份
            description: 验证用户是否为指定社区的成员
            security:
                - BearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - community_id
                                - user_id
                            properties:
                                community_id:
                                    type: integer
                                    description: 社区ID
                                user_id:
                                    type: integer
                                    description: 用户ID
            responses:
                "200":
                    description: 验证成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  is_member:
                                                      type: boolean
                                                      description: 是否为成员
                                                  role:
                                                      type: string
                                                      description: 用户角色

    /api/user/my-active-event:
        get:
            tags:
                - 用户模块
            summary: 获取用户当前进行中的事件
            description: 获取当前用户正在进行的事件列表
            security:
                - BearerAuth: []
            responses:
                "200":
                    description: 获取成功
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/StandardResponse"
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/EventInfo"

