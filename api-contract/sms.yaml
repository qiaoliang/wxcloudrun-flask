openapi: 3.0.3
info:
  title: SafeGuard API - Sms Domain
  description: Sms domain API endpoints
  version: 1.0.0
  contact:
    name: SafeGuard Development Team
    email: dev@safeguard.com
servers:
- url: http://localhost:9999/api
  description: 开发环境
- url: https://prod.safeguard.com/api
  description: 生产环境
paths:
  /api/sms/send_code:
    post:
      tags:
      - 短信模块
      summary: 发送验证码
      description: 向指定手机号发送验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  description: 手机号
                purpose:
                  type: string
                  enum:
                  - register
                  - login
                  - bind_phone
                  default: register
                  description: 验证码用途
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                        code:
                          type: string
                          description: 验证码（仅测试环境返回）
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        code:
          type: integer
          description: 1-成功，0-失败
          example: 1
        msg:
          type: string
          description: 状态消息
          example: success
        data:
          type: object
          description: 响应数据
          nullable: true
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        msg:
          type: string
          example: error message
        data:
          type: object
          nullable: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- BearerAuth: []
